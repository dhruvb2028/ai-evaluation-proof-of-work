name: benchmark-quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run grader regression tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate evidence reports
        run: python scripts/generate_reports.py
      - name: Verify generated reports are committed
        run: git diff --exit-code -- results/

